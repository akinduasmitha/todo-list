<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Flow APK - Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #f3f4f6;
            --app-bg: rgba(255, 255, 255, 0.9);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --accent-color: #f43f5e;
            --success-color: #10b981;
            --border-color: rgba(226, 232, 240, 0.8);
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --app-bg: rgba(30, 41, 59, 0.8);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #818cf8;
            --border-color: rgba(51, 65, 85, 0.8);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--app-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 1.2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 10px;
        }

        .app-header { display: flex; justify-content: space-between; align-items: center; }
        .app-header h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); }
        .date-display { color: var(--text-secondary); font-size: 0.85rem; }

        .chart-wrapper {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 10px;
            height: 180px;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card {
            background: var(--input-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .stat-value { font-size: 1.2rem; font-weight: 700; display: block; }
        .stat-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; }

        .input-group { display: flex; gap: 8px; }
        #taskInput {
            flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);
            background: var(--input-bg); color: var(--text-primary); outline: none;
        }
        .add-btn {
            background: var(--primary-color); color: white; border: none;
            padding: 0 15px; border-radius: 12px; cursor: pointer;
        }

        .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .task-item {
            background: var(--input-bg); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 15px; display: flex; flex-direction: column; gap: 8px;
        }
        .task-top { display: flex; justify-content: space-between; align-items: center; }
        .task-text { font-weight: 500; font-size: 0.95rem; flex: 1; }
        
        .progress-row { display: flex; align-items: center; gap: 10px; }
        .slider { flex: 1; height: 6px; border-radius: 5px; cursor: pointer; }
        .percent-tag { font-weight: 700; font-size: 0.85rem; min-width: 40px; color: var(--primary-color); }

        .lock-badge { font-size: 0.7rem; background: #fee2e2; color: #ef4444; padding: 2px 6px; border-radius: 4px; }
        .delete-btn { color: var(--text-secondary); border: none; background: none; font-size: 1rem; cursor: pointer; }

        /* Scrollbar */
        .task-list { max-height: 300px; overflow-y: auto; padding-right: 5px; }
    </style>
</head>
<body data-theme="light">
    <div class="app-container">
        <header class="app-header">
            <div>
                <h1>Daily Flow</h1>
                <p class="date-display" id="dateDisplay"></p>
            </div>
            <button id="themeToggle" style="background:none; border:none; font-size: 1.2rem; cursor:pointer;">🌙</button>
        </header>

        <div class="chart-wrapper">
            <canvas id="mainChart"></canvas>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="pendingCount">0</span>
                <span class="stat-label">Pending</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="avgProgress">0%</span>
                <span class="stat-label">Today's Avg</span>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add task for today...">
            <button id="addTaskBtn" class="add-btn"><i class="fas fa-plus"></i></button>
        </div>

        <ul class="task-list" id="taskList"></ul>
    </div>

    <script>
        const getToday = () => new Date().toISOString().split('T')[0];
        let tasks = JSON.parse(localStorage.getItem('daily_flow_apk')) || [];
        let myChart = null;

        function save() {
            localStorage.setItem('daily_flow_apk', JSON.stringify(tasks));
            render();
            updateChart();
        }

        function addTask() {
            const val = document.getElementById('taskInput').value.trim();
            if(!val) return;
            tasks.unshift({ id: Date.now(), text: val, progress: 0, date: getToday() });
            document.getElementById('taskInput').value = '';
            save();
        }

        function render() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            const today = getToday();
            
            let pending = 0;
            let todayTotal = 0;
            let todayCount = 0;

            tasks.forEach(t => {
                const isToday = t.date === today;
                if(isToday) {
                    todayCount++;
                    todayTotal += parseInt(t.progress);
                    if(t.progress < 100) pending++;
                }

                const li = document.createElement('li');
                li.className = 'task-item';
                li.innerHTML = `
                    <div class="task-top">
                        <span class="task-text">${t.text}</span>
                        <div>
                            ${!isToday ? '<span class="lock-badge">Locked</span>' : ''}
                            <button class="delete-btn" onclick="deleteTask(${t.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="progress-row">
                        <input type="range" class="slider" value="${t.progress}" 
                            ${!isToday ? 'disabled' : ''} 
                            oninput="updateProgress(${t.id}, this.value)">
                        <span class="percent-tag">${t.progress}%</span>
                    </div>
                `;
                list.appendChild(li);
            });

            document.getElementById('pendingCount').innerText = pending;
            document.getElementById('avgProgress').innerText = todayCount > 0 ? Math.round(todayTotal/todayCount) + '%' : '0%';
            document.getElementById('dateDisplay').innerText = new Date().toDateString();
        }

        function updateProgress(id, val) {
            const task = tasks.find(t => t.id === id);
            if(task && task.date === getToday()) {
                task.progress = val;
                localStorage.setItem('daily_flow_apk', JSON.stringify(tasks));
                // Update text without full re-render for smooth sliding
                render(); 
                updateChart();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
        }

        function updateChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const last7Days = [...Array(7)].map((_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - i);
                return d.toISOString().split('T')[0];
            }).reverse();

            const chartData = last7Days.map(date => {
                const dayTasks = tasks.filter(t => t.date === date);
                if(dayTasks.length === 0) return 0;
                return Math.round(dayTasks.reduce((acc, t) => acc + parseInt(t.progress), 0) / dayTasks.length);
            });

            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7Days.map(d => d.split('-')[2]),
                    datasets: [{
                        label: 'Progress %',
                        data: chartData,
                        borderColor: '#6366f1',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(99, 102, 241, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { min: 0, max: 100 } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        document.getElementById('addTaskBtn').onclick = addTask;
        document.getElementById('themeToggle').onclick = () => {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeToggle').innerText = isDark ? '🌙' : '☀️';
        };

        render();
        updateChart();
    </script>
</body>
</html>
